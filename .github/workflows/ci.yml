name: CI

on:
  # Пуш в любую ветку, PR и ручной запуск со вкладки Actions.
  # Повторный пуш в ту же ветку отменяет предыдущий запуск (см. concurrency).
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: physics
          POSTGRES_PASSWORD: physics
          POSTGRES_DB: physics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U physics"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://physics:physics@localhost:5432/physics_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Проверка контента
        run: go run ./cmd/seed -check
      - name: Тесты (unit + интеграционные)
        run: go test -race ./...

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Проверка типов
        run: npx tsc -b
      - name: Линтер
        run: npx oxlint --deny-warnings src
      - name: Сборка
        run: npm run build

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
